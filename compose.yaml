services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eevee_mcp
      POSTGRES_PASSWORD: eevee
      POSTGRES_USER: eevee
    ports:
      - '55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eevee -d eevee_mcp']
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
